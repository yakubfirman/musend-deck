name: Feature request
description: Suggest a focused improvement to Musend Deck
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the task and who needs it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how the feature should work and any hosting constraints.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
