name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check and build
        run: npm run build
        working-directory: frontend

  backend:
    name: PHP ${{ matrix.php-version }} checks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: posix, zip, pdo_sqlite
          coverage: none

      - name: Check PHP syntax
        run: find backend -type f -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Run backend checks
        run: php backend/tests/run.php

      - name: Check installer shell syntax
        run: |
          bash -n install.sh
          bash -n scripts/build-package.sh

      - name: Check shell scripts
        run: shellcheck install.sh scripts/build-package.sh
